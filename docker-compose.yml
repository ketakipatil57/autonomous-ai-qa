services:
  mysql:
    image: mysql:8.0
    container_name: qa_agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-qa_agent}
      MYSQL_USER: ${MYSQL_USER:-qa_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-qa_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=caching_sha2_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "qa_user", "-pqa_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
